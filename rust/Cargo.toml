[package]
name = "ortho"
version = "0.1.0"
edition = "2024"
description = "Orthographic projection for architecture: renders the six architectural views as SVG from SysML v2 model files"
license = "MIT"
repository = "https://github.com/ola-coding/ortho"
# Until it replaces the TypeScript.
publish = false

[dependencies]
org-eclipse-elk-graph-json = "=0.12.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1.26"
