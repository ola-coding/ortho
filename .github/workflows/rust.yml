# The Rust port, built beside the TypeScript until it replaces it.
#
# test    Builds and tests it on each system it will ship for.
# lint    Formatting and clippy, which read the same on every system.
# oracle  Records what the TypeScript produces at each stage, fails if the committed
#         diagrams are not what it renders, and checks the port against the rest.
#         Recording takes minutes, so it is kept until something it reads changes.
name: Rust

on:
  push:
    branches: [main, rust-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every system rather than stopping at the first failure: which
      # one broke is the point of running three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test

  lint:
    name: Formatting and clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  oracle:
    name: The port against the TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: recording
        uses: actions/cache/restore@v6
        with:
          path: |
            rust/oracle
            .omg-models
          key: oracle-node24-${{ hashFiles('src/**', 'grammar/**', 'examples/**', 'tests/fixtures/**', 'rust/tests/constructs.txt', 'rust/tests/workspaces.txt', 'rust/tests/renderings.json', 'scripts/oracle.ts', 'scripts/fetch-omg-models.ts', 'package.json', 'package-lock.json') }}
      - uses: actions/setup-node@v7
        if: steps.recording.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.recording.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run omg-models
          npm run oracle
      # Saved here, so a comparison that fails below does not cost the next run a recording.
      - if: steps.recording.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            rust/oracle
            .omg-models
          key: ${{ steps.recording.outputs.cache-primary-key }}
      - run: rustup toolchain install
        working-directory: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --test oracle -- --ignored
        working-directory: rust
