<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ortho preview</title>
<style>
:root {
  color-scheme: light dark;
  --fg: #1f2328;
  --dim: #59636e;
  --bg: #ffffff;
  --bar: #f6f8fa;
  --line: #d1d9e0;
  --button: #e8ecf0;
  --button-hover: #dbe1e7;
  --accent: #40657e;
  --accent-fg: #ffffff;
  --error: #cf222e;
  --info: #40657e;
  --note: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e6edf3;
    --dim: #9198a1;
    --bg: #15191e;
    --bar: #1c2128;
    --line: #353c45;
    --button: #2a313a;
    --button-hover: #353d48;
    --accent: #7fa8c4;
    --accent-fg: #0d1117;
    --error: #ff7b72;
    --info: #7fa8c4;
    --note: #1c2128;
  }
}
body {
  margin: 0;
  color: var(--fg);
  background: var(--bg);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  padding: 6px 12px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}
nav, #actions { display: flex; flex-wrap: wrap; gap: 4px; }
#actions[hidden] { display: none; }
button {
  padding: 3px 10px;
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--fg);
  background: var(--button);
  font: inherit;
  cursor: pointer;
}
button:hover:enabled { background: var(--button-hover); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav button[aria-selected='true'] { color: var(--accent-fg); background: var(--accent); }
#status { margin-left: auto; color: var(--dim); white-space: nowrap; }
#status.lost { color: var(--error); }
#messages:empty { display: none; }
#messages { margin: 8px 12px 0; }
.message {
  margin: 0 0 6px;
  padding: 6px 10px;
  border-left: 3px solid var(--info);
  background: var(--note);
  white-space: pre-wrap;
}
.message.error { border-left-color: var(--error); }
.message.link { cursor: pointer; }
.message.link:hover { text-decoration: underline; }
main { padding: 12px; }
main.stale svg { opacity: 0.45; }
/* The diagrams are drawn on white, on a dark page too. */
main svg {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto;
  border-radius: 6px;
  cursor: zoom-in;
}
main.actual-size svg { max-width: none; cursor: zoom-out; }
/* A box opens the line that declares it. */
main svg [data-line] { cursor: pointer; }
main svg [data-line]:hover { filter: brightness(0.93); }
.summary { margin: 8px 0 0; text-align: center; color: var(--dim); }
.empty { color: var(--dim); }
/* A table of requirements, set as GitHub sets the Markdown ortho writes. */
.doc { max-width: 900px; margin: 0 auto; font-size: 14px; line-height: 1.5; overflow-wrap: break-word; }
main.stale .doc { opacity: 0.45; }
.doc h1, .doc h2 { padding-bottom: 0.3em; border-bottom: 1px solid var(--line); font-weight: 600; }
.doc h1 { margin: 0.2em 0 0.4em; font-size: 2em; }
.doc h2 { margin: 1.2em 0 0.5em; font-size: 1.5em; }
.doc h3, .doc h4, .doc h5, .doc h6 { margin: 1em 0 0.5em; font-weight: 600; }
.doc h3 { font-size: 1.25em; }
/* A heading moved to stays clear of the sticky header. */
.doc [data-anchor] { scroll-margin-top: 60px; }
.doc p { margin: 0 0 0.8em; }
.doc sub { font-size: 0.85em; vertical-align: baseline; color: var(--dim); }
.doc table { margin: 0 0 1em; border-collapse: collapse; }
.doc th, .doc td { padding: 5px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
/* An ID such as REQ-1.2 is never broken at its hyphen. */
.doc td:first-child { white-space: nowrap; }
.doc th { font-weight: 600; background: var(--bar); }
.doc a { color: var(--accent); text-decoration: none; cursor: pointer; }
.doc a:hover { text-decoration: underline; }
/* A requirement opens the line that declares it. */
.doc .requirement.opens { margin: 0 -8px; padding: 1px 8px; border-radius: 4px; cursor: pointer; }
.doc .requirement.opens:hover { background: var(--note); }
</style>
</head>
<body>
<header>
  <nav id="tabs" role="tablist"></nav>
  <span id="status" role="status">Connecting…</span>
  <span id="actions" hidden>
    <button type="button" id="save-one" title="Download the view shown as an SVG file">Save SVG</button>
    <button type="button" id="save-all"></button>
  </span>
</header>
<section id="messages"></section>
<main id="diagram"><p class="empty">Open a .sysml file in your editor: its views are drawn here, and again as you type.</p></main>
<script src="markdown.js"></script>
<script>
// The preview's page: a tab for each view ortho drew, the chosen view's diagram or
// table of requirements, and what ortho reported. It asks `ortho lsp`, which serves
// it, for each render, and waits there until there is a newer one.
(function () {
  const tabs = document.getElementById('tabs');
  const status = document.getElementById('status');
  const messages = document.getElementById('messages');
  const diagram = document.getElementById('diagram');
  const actions = document.getElementById('actions');
  const saveOne = document.getElementById('save-one');
  const saveAll = document.getElementById('save-all');

  /** What the page remembers between reloads: the view chosen and its size. */
  let state = {};
  try {
    state = JSON.parse(sessionStorage.getItem('ortho') || '{}');
  } catch {}
  function remember() {
    try {
      sessionStorage.setItem('ortho', JSON.stringify(state));
    } catch {}
  }
  // The editor opens the page at the view asked for: #logical-view.svg
  if (location.hash.length > 1) state.selected = decodeURIComponent(location.hash.slice(1));

  let views = [];
  let folder;
  /** Where each requirement is declared, by its ID, or by its name for one without. */
  let requirements = { byId: {}, byName: {} };

  function element(tag, attributes = {}, text = '') {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
    node.textContent = text;
    return node;
  }

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }

  /** A view's title from its file name: logical-view-survey-drone.svg is "Logical view survey drone". */
  function viewTitle(file) {
    const words = file.replace(/\.(svg|md)$/i, '').replace(/[-_]+/g, ' ').trim();
    return words ? words[0].toUpperCase() + words.slice(1) : 'View';
  }

  /** Short titles for tabs: the words every title ends with are left out. */
  function tabTitles(files) {
    const titles = files.map(viewTitle);
    if (titles.length < 2) return titles;
    const split = titles.map((title) => title.split(' '));
    let common = 0;
    while (
      split.every((words) => common < words.length - 1) &&
      split.every((words) => words.at(-1 - common).toLowerCase() === split[0].at(-1 - common).toLowerCase())
    ) {
      common += 1;
    }
    return split.map((words) => words.slice(0, words.length - common).join(' '));
  }

  function message(problem, kind) {
    const where = problem.file ? `${problem.file.split('/').pop()} line ${problem.line}: ` : '';
    const node = element('p', { class: `message ${kind}` }, where + problem.message);
    if (problem.file) {
      node.classList.add('link');
      node.title = 'Open it in the editor';
      node.addEventListener('click', () => post('open', { file: problem.file, line: problem.line }));
    }
    messages.append(node);
  }

  function selected() {
    return views.find((view) => view.file === state.selected) || views[0];
  }

  function showSelected() {
    const view = selected();
    for (const button of tabs.querySelectorAll('button')) {
      button.setAttribute('aria-selected', String(button.dataset.file === view?.file));
    }
    diagram.replaceChildren();
    diagram.classList.toggle('actual-size', Boolean(state.actualSize) && !view?.markdown);
    showSaveOne(view);
    if (!view) return;
    if (view.markdown) {
      diagram.append(tableOfRequirements(view));
      return;
    }
    const parsed = new DOMParser().parseFromString(view.svg, 'image/svg+xml').documentElement;
    if (parsed.nodeName !== 'svg') {
      diagram.append(element('p', { class: 'empty' }, `${view.heading} could not be read.`));
      return;
    }
    const svg = document.importNode(parsed, true);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', view.heading);
    for (const box of svg.querySelectorAll('[data-line]')) {
      const file = box.getAttribute('data-file') || '';
      const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      tip.textContent = `Open ${file.split('/').pop()} line ${box.getAttribute('data-line')}`;
      box.prepend(tip);
    }
    svg.addEventListener('click', (event) => {
      // A box opens the line that declares it; anywhere else switches between fitting
      // the window and actual size.
      const box = event.target.closest('[data-line]');
      if (box) {
        post('open', { file: box.getAttribute('data-file'), line: Number(box.getAttribute('data-line')) });
        return;
      }
      state.actualSize = !state.actualSize;
      remember();
      diagram.classList.toggle('actual-size', state.actualSize);
    });
    diagram.append(svg, element('p', { class: 'summary' }, view.summary));
  }

  /**
   * A table of requirements as GitHub shows its Markdown: a box under each
   * requirement's heading, which opens the line that declares it, and links that open
   * the model's lines or move to a requirement in the table.
   */
  function tableOfRequirements(view) {
    const reader = window.orthoMarkdown;
    const blocks = reader.parse(view.markdown);
    const page = element('article', { class: 'doc', 'aria-label': view.heading });
    for (let i = 0; i < blocks.length; i++) {
      const block = blocks[i];
      const next = blocks[i + 1];
      if (block.type === 'heading' && next?.type === 'table' && reader.plainText(next.head[1] ?? []) === 'Statement') {
        page.append(requirementBox(reader, block, next));
        i++;
      } else {
        page.append(blockNode(block));
      }
    }
    return page;
  }

  /** A requirement's heading and box, which open the line that declares it. */
  function requirementBox(reader, heading, table) {
    const box = element('section', { class: 'requirement' });
    box.append(blockNode(heading), blockNode(table));
    const id = reader.plainText(table.rows[0]?.[0] ?? []);
    const at = requirements.byId[id] ?? requirements.byName[reader.plainText(heading.children)];
    if (!at) return box;
    box.classList.add('opens');
    box.title = `Open ${at.file.split('/').pop()} line ${at.line}`;
    box.addEventListener('click', (event) => {
      // Text selected to copy it, or a link, is not a click on the box.
      if (String(window.getSelection() ?? '') || event.target.closest('a')) return;
      post('open', { file: at.file, line: at.line });
    });
    return box;
  }

  function blockNode(block) {
    if (block.type === 'heading') {
      const node = element(`h${block.level}`, { 'data-anchor': block.id });
      node.append(...inlineNodes(block.children));
      return node;
    }
    if (block.type === 'paragraph') {
      const node = element('p');
      node.append(...inlineNodes(block.children));
      return node;
    }
    const table = element('table');
    const thead = element('thead');
    const head = element('tr');
    for (const cell of block.head) {
      const th = element('th');
      th.append(...inlineNodes(cell));
      head.append(th);
    }
    thead.append(head);
    const body = element('tbody');
    for (const row of block.rows) {
      const tr = element('tr');
      for (const cell of row) {
        const td = element('td');
        td.append(...inlineNodes(cell));
        tr.append(td);
      }
      body.append(tr);
    }
    table.append(thead, body);
    return table;
  }

  function inlineNodes(children) {
    return children.map((child) => {
      if (child.type === 'text') return document.createTextNode(child.text);
      if (child.type === 'br') return element('br');
      if (child.type === 'sub') {
        const sub = element('sub');
        sub.append(...inlineNodes(child.children));
        return sub;
      }
      const link = element('a', { href: '#' });
      link.append(...inlineNodes(child.children));
      const href = String(child.href);
      if (href.startsWith('#')) {
        link.title = `Go to ${link.textContent}`;
        link.addEventListener('click', (event) => {
          event.preventDefault();
          const target = diagram.querySelector(`[data-anchor="${CSS.escape(href.slice(1))}"]`);
          if (!target) return;
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          const box = target.closest('.requirement') ?? target;
          box.animate([{ background: 'var(--note)' }, { background: 'transparent' }], 1200);
        });
      } else {
        const place = /^([^#]*)(?:#L(\d+))?$/.exec(href);
        const file = decodeURIComponent(place?.[1] ?? href).split('/').pop();
        link.title = place?.[2] ? `Open ${file} line ${place[2]}` : `Open ${file}`;
        link.addEventListener('click', (event) => {
          event.preventDefault();
          post('open', { link: href });
        });
      }
      return link;
    });
  }

  function showTabs() {
    const titles = tabTitles(views.map((view) => view.file));
    tabs.replaceChildren(
      ...views.map((view, i) => {
        const button = element('button', { role: 'tab', type: 'button', title: view.heading }, titles[i]);
        button.dataset.file = view.file;
        button.addEventListener('click', () => {
          state.selected = view.file;
          remember();
          showSelected();
        });
        return button;
      }),
    );
  }

  /** The save buttons: hidden with no views, disabled while the model does not load. */
  function showActions(how, saveTo) {
    actions.hidden = how === 'none';
    saveOne.disabled = saveAll.disabled = how === 'stale';
    saveAll.textContent = `Save all to ${saveTo}/`;
    saveAll.title =
      how === 'stale'
        ? 'The model does not load now: fix its problems to save its views'
        : `Write every view into the ${saveTo} folder beside the model, as ortho render does`;
  }

  /** The first save button downloads the view shown: a diagram as SVG, or the table of requirements as Markdown. */
  function showSaveOne(view) {
    const markdown = Boolean(view?.markdown);
    saveOne.textContent = markdown ? 'Save Markdown' : 'Save SVG';
    saveOne.title = markdown
      ? 'Download the table shown as a Markdown file, its links written for the folder Save all writes to'
      : 'Download the view shown as an SVG file';
  }

  saveOne.addEventListener('click', () => {
    const view = selected();
    if (!view) return;
    const link = element('a', { download: view.file });
    const [text, type] = view.markdown ? [view.markdown, 'text/markdown'] : [view.svg, 'image/svg+xml'];
    link.href = URL.createObjectURL(new Blob([text], { type }));
    link.click();
    URL.revokeObjectURL(link.href);
  });
  saveAll.addEventListener('click', async () => {
    const answer = await (await post('save', {})).json();
    messages.querySelector('.saved')?.remove();
    message({ message: answer.message }, answer.ok ? 'info saved' : 'error saved');
  });

  // The page closes itself when the editor has no model file open, or has been gone
  // for longer than a restart of ortho takes. A browser lets a page close the tab it
  // was opened in, and no other; where it refuses, the page says why it stays, and
  // picks up again once a model file is opened.
  const GONE = 5000;
  let showing = false;
  function leave(reason) {
    if (showing) window.close();
    showing = false;
    diagram.classList.add('stale');
    actions.hidden = true;
    messages.replaceChildren();
    message({ message: reason }, 'info');
    status.textContent = 'Nothing to show';
  }

  function show(data) {
    if (data.closed) {
      leave('No model file is open in the editor. Open one, and its diagrams are drawn here.');
      return;
    }
    showing = Boolean(data.model);
    // Another model's diagrams never stand in for this one's.
    if (folder !== data.folder) views = [];
    folder = data.folder;
    messages.replaceChildren();
    for (const error of data.errors) message(error, 'error');
    for (const note of data.notes) message(note, 'info');
    const time = new Date().toLocaleTimeString();
    document.title = data.model ? `${data.model} · Ortho preview` : 'Ortho preview';
    // The editor asked for a view: the page turns to it, once.
    if (data.select && data.select.time !== state.select) {
      state.select = data.select.time;
      state.selected = data.select.file;
      remember();
    }
    if (data.views.length > 0) {
      views = data.views;
      requirements = data.requirements ?? { byId: {}, byName: {} };
      showTabs();
      showSelected();
      diagram.classList.remove('stale');
      showActions('current', data.saveTo);
      status.textContent = `${data.model}: ${views.length} view${views.length === 1 ? '' : 's'}, ${time}`;
    } else if (views.length > 0) {
      // The model does not load now: the last diagrams stay, faded, until it does.
      diagram.classList.add('stale');
      showActions('stale', data.saveTo);
      status.textContent = `${data.model}: not rendered, ${time}`;
    } else if (data.model) {
      tabs.replaceChildren();
      diagram.replaceChildren(element('p', { class: 'empty' }, 'No diagrams yet.'));
      showActions('none', data.saveTo);
      status.textContent = `${data.model}: not rendered, ${time}`;
    }
  }

  // Each answer comes when there is a render newer than the one shown, or after a
  // while with the same one. An editor started again serves the same address, so the
  // page finds it again by asking until it answers.
  let session = '';
  let version = 0;
  let lost = 0;
  async function follow() {
    for (;;) {
      try {
        const answer = await fetch(`state?session=${session}&after=${version}`, { cache: 'no-store' });
        const data = await answer.json();
        lost = 0;
        status.classList.remove('lost');
        if (data.session !== session || data.version !== version) {
          session = data.session;
          version = data.version;
          show(data);
        }
      } catch {
        lost ||= Date.now();
        status.classList.add('lost');
        status.textContent = 'Waiting for the editor…';
        if (showing && Date.now() - lost > GONE) {
          leave('The editor has closed this project. Open a model file in it, and its diagrams are drawn here.');
        }
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
    }
  }
  follow();
})();
</script>
</body>
</html>
