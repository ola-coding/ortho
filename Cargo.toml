[package]
name = "ortho"
version = "0.1.0"
edition = "2024"
description = "Orthographic projection for architecture: renders the six architectural views as SVG from SysML v2 model files"
license = "MIT"
repository = "https://github.com/ola-coding/ortho"
readme = "README.md"
keywords = ["sysml", "architecture", "diagrams", "svg", "mbse"]
categories = ["command-line-utilities", "visualization"]
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
org-eclipse-elk-graph-json = "=0.12.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1.26"

[workspace]
members = ["xtask"]

# Release binaries: smaller, and as fast as a build allows.
[profile.release]
lto = true
codegen-units = 1
strip = true
